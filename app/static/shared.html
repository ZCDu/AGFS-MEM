<!DOCTYPE html>
<!--
  Guest chat for a share link, served at /shared/{share_id}.

  Deliberately NOT a mode of chat.html: no sign-in, no user switcher, no
  session list, no wiki picker, no file uploads -- a guest has only a link,
  no account, and nothing here should imply otherwise. Every write this page
  can cause is bounded server-side to one connected component of the
  owner's graph (see app/shares/scope.py); this page has no privileged
  knowledge of that boundary, it just shows what the server reports back
  after each turn (applied vs rejected).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared notes</title>
<style>
  :root {
    --bg:#e9edf2; --panel:#fff; --ink:#16202b; --ink-soft:#5c6b7a;
    --line:#ccd5de; --line-soft:#e3e9ef; --accent:#2f4fd4;
    --danger:#b3442f; --ok:#1f7a6b; --warn:#c07d12;
    --mono: ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
    --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font:14px/1.5 var(--sans); color:var(--ink); background:var(--bg);
       display:flex; flex-direction:column}

  header{display:flex; align-items:center; gap:10px; padding:11px 16px;
         background:var(--panel); border-bottom:1px solid var(--line)}
  header h1{font:600 15px var(--sans); margin:0}
  header .meta{font-size:12px; color:var(--ink-soft)}
  header .sp{flex:1}
  .pill{display:inline-block; font:10px var(--mono); letter-spacing:.04em;
        text-transform:uppercase; color:#fff; padding:2px 6px; border-radius:2px;
        background:var(--accent)}

  main{flex:1; display:flex; flex-direction:column; min-height:0; max-width:820px;
       width:100%; margin:0 auto}
  #log{flex:1; overflow-y:auto; padding:18px 20px}
  .msg{max-width:min(700px,92%); margin:0 0 14px; display:flex; gap:10px}
  .msg .who{font:600 10px var(--sans); letter-spacing:.08em; text-transform:uppercase;
            color:var(--ink-soft); flex:0 0 46px; padding-top:3px}
  .msg .body{background:var(--panel); border:1px solid var(--line-soft);
             border-radius:4px; padding:9px 12px; white-space:pre-wrap; flex:1}
  .msg.user .body{background:#e8ecfb; border-color:#d2daf5}
  .msg.err .body{border-color:#e6c4bc; color:var(--danger)}
  .msg .saved{margin-top:7px; padding-top:6px; border-top:1px solid var(--line-soft);
              font-size:11px}
  .msg .saved .ok{color:var(--ok)}
  .msg .saved .no{color:var(--warn)}

  .composer{border-top:1px solid var(--line); background:var(--panel); padding:11px 14px}
  .composer .row{display:flex; gap:8px; align-items:flex-end}
  textarea,button{font:14px var(--sans); color:var(--ink);
    border:1px solid var(--line); border-radius:3px; padding:8px 10px; background:#fff}
  textarea{flex:1; resize:vertical; min-height:44px; max-height:180px}
  button{cursor:pointer; background:var(--ink); color:#fff; border-color:var(--ink);
         font-weight:600; white-space:nowrap}
  button:hover{background:#22303f}
  button:disabled{opacity:.5; cursor:default}
  :focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .hint{font-size:11px; color:var(--ink-soft); margin-top:6px}

  .center{margin:auto; text-align:center; padding:40px 20px; color:var(--ink-soft)}
</style>
</head>
<body>

<header id="header" hidden>
  <span class="pill">Shared</span>
  <h1 id="h_label">&mdash;</h1>
  <span class="meta" id="h_meta"></span>
  <span class="sp"></span>
  <span class="meta">Notes here go only into what was shared with you.</span>
</header>

<main>
  <div id="log">
    <div class="center" id="loading">Loading&hellip;</div>
  </div>
  <div class="composer" id="composer" hidden>
    <div class="row">
      <textarea id="input" placeholder="Type a message, then Enter to send (Shift+Enter for a new line)"></textarea>
      <button id="send">Send</button>
    </div>
    <div class="hint">Anything you say that fits this topic gets remembered here automatically &mdash;
      no separate save step. Unrelated things won't be recorded, and you'll be told when that happens.</div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[<>&"]/g, c =>
  ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

const shareId = location.pathname.split("/").filter(Boolean).pop();
let messages = [];   // {role, content, applied, rejected}
let sessionId = null;

async function api(method, path, body) {
  const res = await fetch(`/v1/shared/${encodeURIComponent(shareId)}${path}`, {
    method,
    headers: body ? {"content-type": "application/json"} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const detail = data && data.detail
      ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail))
      : `HTTP ${res.status}`;
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  return data;
}

function render() {
  $("log").innerHTML = messages.map(m => `
    <div class="msg ${m.role === "user" ? "user" : ""}${m.error ? " err" : ""}">
      <span class="who">${m.role === "user" ? "You" : "Bot"}</span>
      <div class="body">${esc(m.content)}${
        (m.applied && m.applied.length) || (m.rejected && m.rejected.length)
          ? `<div class="saved">${
              m.applied && m.applied.length
                ? `<span class="ok">Saved: ${m.applied.map(o => esc(o.wiki_id)).join(", ")}</span>`
                : ""
            }${
              m.rejected && m.rejected.length
                ? `${m.applied && m.applied.length ? " &middot; " : ""}<span class="no">Not saved (outside this share): ${
                    m.rejected.map(o => esc(o.wiki_id)).join(", ")}</span>`
                : ""
            }</div>`
          : ""}</div>
    </div>`).join("");
  $("log").scrollTop = $("log").scrollHeight;
}

async function send() {
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  messages.push({role: "user", content: text});
  render();

  $("send").disabled = true;
  messages.push({role: "assistant", content: "…"});
  render();

  try {
    const res = await api("POST", "/chat", {
      messages: messages.filter(m => m.content !== "…")
                        .map(m => ({role: m.role, content: m.content})),
      session_id: sessionId,
    });
    sessionId = res.session_id;
    messages.pop();
    messages.push({role: "assistant", content: res.reply,
                   applied: res.applied, rejected: res.rejected});
  } catch (e) {
    messages.pop();
    messages.push({role: "assistant", content: e.message, error: true});
  } finally {
    $("send").disabled = false;
    render();
  }
}

$("send").onclick = send;

async function init() {
  try {
    const preview = await api("GET", "");
    if (!preview.active) {
      $("log").innerHTML = `<div class="center">This share link is no longer active.</div>`;
      return;
    }
    $("header").hidden = false;
    $("h_label").textContent = preview.label || preview.entry_title;
    $("h_meta").textContent = `${preview.entry_type} · ${preview.scope_size} linked ${
      preview.scope_size === 1 ? "item" : "items"}`;
    $("log").innerHTML = `<div class="center">Say something about &ldquo;${
      esc(preview.label || preview.entry_title)}&rdquo; to get started.</div>`;
    $("composer").hidden = false;
    $("input").focus();
    $("input").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
  } catch (e) {
    const msg = e.status === 404 ? "This link doesn't point to anything (it may be mistyped)."
              : e.status === 410 ? "This share link is no longer active."
              : e.message;
    $("log").innerHTML = `<div class="center">${esc(msg)}</div>`;
  }
}

init();
</script>
</body>
</html>
