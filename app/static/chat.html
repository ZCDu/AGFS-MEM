<!DOCTYPE html>
<!--
  Chat UI, served by the app at /chat.

  Three panes, matching the three stages of the pipeline: the conversation on
  the left, what memory was retrieved to answer it in the middle-right, and
  the extraction review below that. The middle pane exists because a memory
  system that silently decides what it knows is impossible to debug — you need
  to see WHICH entities informed an answer.

  Extraction is two explicit steps: Review builds a plan and writes nothing,
  Apply commits it. A model deciding on its own what to write into long-term
  memory is how memory fills with hallucinations.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对话</title>
<style>
  :root {
    --bg:#e9edf2; --panel:#fff; --ink:#16202b; --ink-soft:#5c6b7a;
    --line:#ccd5de; --line-soft:#e3e9ef; --accent:#2f4fd4;
    --danger:#b3442f; --ok:#1f7a6b; --warn:#c07d12;
    --mono: ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
    --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font:14px/1.5 var(--sans); color:var(--ink); background:var(--bg);
       display:grid; grid-template-columns:1fr 340px; grid-template-rows:46px 1fr;
       grid-template-areas:"top top" "chat side"}

  header{grid-area:top; display:flex; align-items:center; gap:12px; padding:0 14px;
         background:var(--panel); border-bottom:1px solid var(--line)}
  header h1{font:600 13px var(--sans); letter-spacing:.08em; text-transform:uppercase;
            margin:0; color:var(--ink-soft)}
  header .sp{flex:1}
  a.navlink{font-size:12px; color:var(--accent); text-decoration:none}
  a.navlink:hover{text-decoration:underline}

  main{grid-area:chat; display:flex; flex-direction:column; min-height:0}
  #log{flex:1; overflow-y:auto; padding:18px 20px}
  .msg{max-width:min(760px,92%); margin:0 0 14px; display:flex; gap:10px}
  .msg .who{font:600 10px var(--sans); letter-spacing:.08em; text-transform:uppercase;
            color:var(--ink-soft); flex:0 0 46px; padding-top:3px}
  .msg .body{background:var(--panel); border:1px solid var(--line-soft);
             border-radius:4px; padding:9px 12px; white-space:pre-wrap; flex:1}
  .msg.user .body{background:#e8ecfb; border-color:#d2daf5}
  .msg.err .body{border-color:#e6c4bc; color:var(--danger)}
  .msg .cite{margin-top:7px; padding-top:6px; border-top:1px solid var(--line-soft);
             font:11px var(--mono); color:var(--ink-soft)}
  .msg .files{margin-top:6px; display:flex; flex-wrap:wrap; gap:3px}
  .msg .file-badge{display:inline-flex; align-items:center; gap:3px;
                    background:var(--bg); border:1px solid var(--line);
                    border-radius:3px; padding:2px 7px; font-size:11px}
  .msg .file-badge .ficon{font-size:14px}

  .composer{border-top:1px solid var(--line); background:var(--panel); padding:11px 14px}
  .composer .row{display:flex; gap:8px; align-items:flex-end}
  textarea,input,select,button{font:14px var(--sans); color:var(--ink);
    border:1px solid var(--line); border-radius:3px; padding:8px 10px; background:#fff}
  textarea{flex:1; resize:vertical; min-height:44px; max-height:180px}
  button{cursor:pointer; background:var(--ink); color:#fff; border-color:var(--ink);
         font-weight:600; white-space:nowrap}
  button:hover{background:#22303f}
  button:disabled{opacity:.5; cursor:default}
  button.ghost{background:#fff; color:var(--ink); border-color:var(--line); font-weight:500}
  button.ghost:hover{background:var(--bg)}
  button.sm{padding:4px 9px; font-size:12px}
  :focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .hint{font-size:11px; color:var(--ink-soft); margin-top:6px}

  /* attach button */
  #attach-btn{background:transparent; border:none; color:var(--ink-soft); font-size:20px;
              cursor:pointer; padding:4px 6px; line-height:1; border-radius:3px}
  #attach-btn:hover{background:var(--line-soft); color:var(--ink)}
  #file-input{display:none}

  /* file chips below input */
  #file-chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; min-height:0}
  .file-chip{display:inline-flex; align-items:center; gap:5px;
             background:var(--line-soft); border-radius:3px; padding:3px 8px;
             font-size:11px; max-width:200px}
  .file-chip .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
  .file-chip .sz{color:var(--ink-soft); font-size:10px; flex-shrink:0}
  .file-chip .rm{cursor:pointer; color:var(--ink-soft); font-weight:bold;
                 font-size:14px; line-height:1; flex-shrink:0}
  .file-chip .rm:hover{color:var(--danger)}
  .file-chip.uploading{opacity:.6}
  .file-chip.failed{border:1px solid var(--danger); color:var(--danger)}

  aside{grid-area:side; background:var(--panel); border-left:1px solid var(--line);
        overflow-y:auto; display:flex; flex-direction:column}
  section{padding:12px 14px; border-bottom:1px solid var(--line-soft)}
  section h2{font:600 11px var(--sans); letter-spacing:.09em; text-transform:uppercase;
             color:var(--ink-soft); margin:0 0 9px}
  label{display:block; font-size:11px; color:var(--ink-soft); margin:7px 0 3px}
  .muted{color:var(--ink-soft); font-size:12px}
  .item{border:1px solid var(--line-soft); border-radius:3px; padding:7px 9px;
        margin-bottom:6px; background:#fcfdfe}
  .id{font:10px var(--mono); color:var(--ink-soft)}
  .pill{display:inline-block; font:10px var(--mono); letter-spacing:.04em;
        text-transform:uppercase; color:#fff; padding:2px 6px; border-radius:2px}
  .op{font:11px var(--mono); padding:3px 0; border-bottom:1px solid var(--line-soft);
       overflow-wrap:anywhere}
  .op:last-child{border-bottom:0}
  .errbox{border:1px solid #e6c4bc; background:#fdf3f1; color:var(--danger);
          border-radius:3px; padding:8px; margin-top:8px; font-size:12px;
          max-height:220px; overflow-y:auto; white-space:pre-wrap;
          overflow-wrap:anywhere}
  .errbox .top{font-weight:600; margin-bottom:4px}
  .errbox button{margin-top:6px}

  #toast{position:fixed; right:16px; bottom:16px; max-width:min(460px,calc(100vw - 32px));
         max-height:40vh; overflow-y:auto; background:var(--ink);
         color:#fff; padding:9px 12px; border-radius:3px; font-size:13px; opacity:0;
         transform:translateY(6px); transition:opacity .18s,transform .18s;
         pointer-events:none; z-index:9;
         white-space:pre-wrap; overflow-wrap:anywhere}
  #toast.show{opacity:1; transform:none}
  #toast.err{background:var(--danger)}
  @media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>

<header>
  <h1>对话</h1>
  <label for="user" style="margin:0">用户</label>
  <input id="user" value="demo" style="width:110px; font-family:var(--mono); padding:4px 7px">
  <label for="token" style="margin:0">令牌</label>
  <input id="token" type="password" placeholder="如已启用认证" autocomplete="off"
         style="width:130px; font-family:var(--mono); padding:4px 7px">
  <button class="sm ghost" id="signin" style="padding:4px 9px">登录</button>
  <button class="sm ghost" id="signout" style="padding:4px 9px">退出</button>
  <span class="sp"></span>
  <span id="who" class="muted" style="font-size:11px"></span>
  <a class="navlink" href="/gui">图谱编辑器 &rarr;</a>
</header>

<main>
  <div id="log">
    <div class="msg">
      <span class="who">系统</span>
      <div class="body">随便问点什么。该用户已存储在记忆中的内容会被检索并用于回答——右侧面板会显示检索到了什么。

当对话中包含值得保留的内容时，点击<strong>审查提取</strong>。
它会提出修改建议，但不会写入任何内容。</div>
    </div>
  </div>
  <div class="composer">
    <div id="file-chips"></div>
    <div class="row">
      <button id="attach-btn" title="添加附件">📎</button>
      <input type="file" id="file-input" multiple>
      <textarea id="input" placeholder="输入消息，或将文件拖放到此处…"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint">
      <label style="display:inline; margin:0">
        <input type="checkbox" id="usemem" checked style="width:auto; vertical-align:-2px"> 使用记忆
      </label>
      &nbsp;·&nbsp; <span id="turns">0 轮</span>
      &nbsp;·&nbsp; <span id="sess" class="muted"></span>
      &nbsp;·&nbsp; <a href="#" id="clear" class="navlink">清空对话</a>
    </div>
  </div>
</main>

<aside>
  <section>
    <h2>上次回复使用的记忆</h2>
    <div id="context"><p class="muted">尚未检索到任何内容。</p></div>
  </section>

  <section>
    <h2>提取</h2>
    <p class="muted">将这段对话转化为长期记忆。先审查——不会写入任何内容。</p>
    <div style="height:8px"></div>
    <div class="row" style="display:flex; gap:6px">
      <button class="ghost sm" id="review">审查提取</button>
      <button class="sm" id="apply" disabled>应用</button>
    </div>
    <div id="plan" style="margin-top:10px"></div>
  </section>
</aside>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/static/auth.js"></script>
<script>
const $ = id => document.getElementById(id);
let messages = [];          // {role, content}
let reviewedOps = null;
let reviewedFrom = null;    // 生成计划时的对话记录
let sessionId = null;
let sessionDate = null;

const user = () => $("user").value.trim() || "demo";
const base = () => `/v1/users/${encodeURIComponent(user())}`;
const esc = t => String(t == null ? "" : t).replace(/[<>&"]/g, c =>
  ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.className = ""), 4000);
}

const authHeaders = () => MemAuth.headers();

async function api(method, path, body) {
  const res = await fetch(base() + path, {
    method,
    headers: {...(body ? {"content-type": "application/json"} : {}), ...authHeaders()},
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    let detail = data && data.detail
      ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail))
      : `HTTP ${res.status}`;
    if (res.status === 401) detail += " — 请在上方输入令牌。";
    if (res.status === 403) detail += " — 该令牌属于其他用户。";
    if (res.status === 503) detail += " — 请在 .env 中设置 DEEPSEEK_API_KEY 并重启。";
    throw new Error(detail);
  }
  return data;
}

/* ---------------- 对话 ---------------- */

function render() {
  $("log").innerHTML = messages.map(m => `
    <div class="msg ${m.role === "user" ? "user" : ""}${m.error ? " err" : ""}">
      <span class="who">${m.role === "user" ? "你" : "助手"}</span>
      <div class="body">${esc(m.content)}${m.files && m.files.length ? `
        <div class="files">${m.files.map(f =>
          `<span class="file-badge"><span class="ficon">📄</span>${esc(f.name)}</span>`
        ).join("")}</div>` : ""}${
        m.cites && m.cites.length
          ? `<div class="cite">记忆来源: ${m.cites.map(c => esc(c.wiki_id)).join(", ")}</div>`
          : ""}</div>
    </div>`).join("");
  $("log").scrollTop = $("log").scrollHeight;
  $("turns").textContent = `${messages.length} 轮`;
}

function transcript() {
  return messages.map(m => `${m.role === "user" ? "用户" : "助手"}: ${m.content}`)
                 .join("\n\n");
}

async function send() {
  const text = $("input").value.trim();
  const hasFiles = pendingFiles.some(f => f.uploaded && f.file_id);
  if (!text && !hasFiles) return;
  $("input").value = "";

  // 收集已上传完成的文件，附加到消息中
  const attachedFiles = pendingFiles.filter(f => f.uploaded && f.file_id);
  const fileNames = attachedFiles.map(f => ({name: f.name}));
  pendingFiles = pendingFiles.filter(f => !f.uploaded || !f.file_id);
  renderChips();

  messages.push({role: "user", content: text || " ", files: fileNames.length ? fileNames : undefined});
  render();

  $("send").disabled = true;
  messages.push({role: "assistant", content: "…"});
  render();

  try {
    const body = {
      messages: messages.filter(m => m.content !== "…")
                        .map(m => ({role: m.role, content: m.content})),
      use_memory: $("usemem").checked,
      session_id: sessionId,
    };
    if (attachedFiles.length) {
      body.attachments = attachedFiles.map(f => `file:${f.session_id}:${f.file_id}`);
    }
    const res = await api("POST", "/chat", body);
    if (res.session_id) {
      sessionId = res.session_id;
      sessionDate = new Date().toISOString().slice(0, 10);
      $("sess").textContent = "会话 " + sessionId;
    }
    messages.pop();
    messages.push({role: "assistant", content: res.reply, cites: res.context_used});
    renderContext(res.context_used);
  } catch (e) {
    messages.pop();
    messages.push({role: "assistant", content: e.message, error: true});
  } finally {
    $("send").disabled = false;
    render();
    if (reviewedFrom !== null && reviewedFrom !== transcript()) {
      $("apply").disabled = true;
      reviewedOps = null; reviewedFrom = null;
    }
  }
}

function renderContext(used) {
  if (!used || !used.length) {
    $("context").innerHTML = `<p class="muted">记忆中没有匹配该消息的内容。</p>`;
    return;
  }
  $("context").innerHTML = used.map(c => `
    <div class="item">
      <div>${esc(c.title)}</div>
      <div class="id">${esc(c.wiki_id)} · 匹配方式: ${esc(c.matched_on)} · ${c.confidence}</div>
    </div>`).join("");
}

/* ---------------- 提取 ---------------- */

const OP_COLOUR = {upsert_entity: "var(--accent)", add_fact: "var(--ok)",
                   link_entities: "var(--warn)"};

function showError(title, message) {
  const full = String(message || "");
  const short = full.length > 400 ? full.slice(0, 400) + "…" : full;
  console.error(title + ":", full);
  $("plan").innerHTML = `
    <div class="errbox">
      <div class="top">${esc(title)}</div>
      <div id="errtext">${esc(short)}</div>
      ${full.length > 400
        ? `<button class="ghost sm" id="errmore">显示全部 ${full.length} 个字符</button>`
        : ""}
      <button class="ghost sm" id="errcopy">复制</button>
    </div>`;
  const more = $("errmore");
  if (more) more.onclick = () => { $("errtext").textContent = full; more.remove(); };
  $("errcopy").onclick = async () => {
    try { await navigator.clipboard.writeText(full); toast("已复制"); }
    catch { toast("无法复制 — 详情已输出到浏览器控制台", true); }
  };
}

function renderPlan(plan) {
  const parts = [];
  const tone = plan.decision === "store" ? "var(--ok)"
             : plan.decision === "review" ? "var(--warn)" : "var(--ink-soft)";
  parts.push(`<div><span class="pill" style="background:${tone}">${esc(plan.decision)}</span>
    <span class="muted" style="margin-left:6px">${plan.llm_used ? "已调用模型" : "未调用模型"}</span></div>`);

  if (!plan.operations.length) {
    parts.push(`<p class="muted" style="margin-top:8px">未提出任何建议。</p>`);
  } else {
    parts.push(`<div style="margin-top:9px">` + plan.operations.map(o => `
      <div class="op"><span style="color:${OP_COLOUR[o.op] || "var(--ink)"}">${esc(o.op)}</span>
        ${esc(o.wiki_id)}${o.status !== "proposed" ? ` <em>${esc(o.status)}</em>` : ""}
        ${o.detail ? `<div class="muted" style="font-size:10px">${esc(o.detail)}</div>` : ""}
      </div>`).join("") + `</div>`);
  }
  for (const r of plan.rejected || []) {
    parts.push(`<div class="muted" style="margin-top:7px; color:var(--danger)">${esc(r.reason)}</div>`);
  }
  if (plan.discarded && plan.discarded.length) {
    parts.push(`<div class="muted" style="margin-top:7px">已忽略: ${
      plan.discarded.map(esc).join("; ")}</div>`);
  }
  $("plan").innerHTML = parts.join("");
}

$("review").onclick = async () => {
  if (!messages.length) return toast("请先输入内容", true);
  $("review").disabled = true;
  try {
    const text = transcript();
    const plan = await api("POST", "/extract",
      {text, session_id: sessionId, session_date: sessionDate});
    renderPlan(plan);
    reviewedOps = plan.operations.filter(o => o.status === "proposed");
    reviewedFrom = text;
    $("apply").disabled = !reviewedOps.length;
    if (!plan.operations.length) toast("暂无可存储的内容");
  } catch (e) {
    showError("审查失败", e.message);
  } finally { $("review").disabled = false; }
};

$("apply").onclick = async () => {
  if (!reviewedOps || !reviewedOps.length) return toast("请先审查", true);
  $("apply").disabled = true;
  try {
    const res = await api("POST", "/extract/apply", {
      operations: reviewedOps.map(o => ({
        op: o.op, wiki_id: o.wiki_id, payload: o.payload, reason: o.reason || "",
      })),
    });
    renderPlan({decision: "applied", llm_used: false,
                operations: res.operations, rejected: [], discarded: []});
    toast(res.failed
      ? `已存储 ${res.applied} 项，${res.failed} 项失败 — 详见面板`
      : `已存储 ${res.applied} 项`,
      res.failed > 0);
    reviewedOps = null; reviewedFrom = null;
  } catch (e) {
    showError("应用失败", e.message);
    $("apply").disabled = false;
  }
};

/* ---------------- 文件上传 ---------------- */

let pendingFiles = [];  // {name, file_id, session_id, size, uploaded, error}

const fi = $("file-input");
const chips = $("file-chips");

$("attach-btn").onclick = () => fi.click();
fi.onchange = () => { if (fi.files.length) uploadFiles(fi.files); fi.value = ""; };

// 页面任意位置拖放
let dragCounter = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); dragCounter++; });
document.addEventListener("dragleave", () => { dragCounter--; });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  dragCounter = 0;
  if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});

// 从剪贴板粘贴文件
$("input").addEventListener("paste", e => {
  const items = e.clipboardData?.items;
  if (!items) return;
  const files = [];
  for (const item of items) {
    if (item.kind === "file") files.push(item.getAsFile());
  }
  if (files.length) { e.preventDefault(); uploadFiles(files); }
});

function fmtSize(n) {
  if (n < 1024) return n + "B";
  if (n < 1024*1024) return (n/1024).toFixed(1) + "KB";
  return (n/(1024*1024)).toFixed(1) + "MB";
}

function renderChips() {
  chips.innerHTML = pendingFiles.map((f, i) => {
    let cls = "file-chip";
    if (f.error) cls += " failed";
    else if (!f.uploaded) cls += " uploading";
    return `<span class="${cls}" title="${esc(f.name)}">
      <span class="name">${esc(f.name)}</span>
      <span class="sz">${f.error ? esc(f.error) : f.uploaded ? "✓" : fmtSize(f.size)}</span>
      <span class="rm" onclick="removeFile(${i})">&times;</span>
    </span>`;
  }).join("");
}

function removeFile(i) { pendingFiles.splice(i, 1); renderChips(); }

async function uploadFiles(fileList) {
  if (!sessionId) {
    sessionId = "sess-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    $("sess").textContent = "会话 " + sessionId;
  }
  for (const file of fileList) {
    const entry = {name: file.name, file_id: null, session_id: sessionId,
                   size: file.size, uploaded: false, error: null};
    pendingFiles.push(entry);
    const idx = pendingFiles.length - 1;
    renderChips();
    try {
      const fd = new FormData();
      fd.append("file", file);
      fd.append("session_id", sessionId);
      const res = await fetch(base() + "/files", {
        method: "POST", headers: authHeaders(), body: fd,
      });
      if (!res.ok) {
        const t = await res.text(); let d = null;
        try { d = JSON.parse(t); } catch {}
        throw new Error(d?.detail || `HTTP ${res.status}`);
      }
      const meta = await res.json();
      pendingFiles[idx].file_id = meta.file_id;
      pendingFiles[idx].uploaded = true;
    } catch (e) {
      pendingFiles[idx].error = e.message;
    }
    renderChips();
  }
}

$("send").onclick = send;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("clear").onclick = e => {
  e.preventDefault();
  messages = []; reviewedOps = null; reviewedFrom = null;
  pendingFiles = []; renderChips();
  sessionId = null; sessionDate = null;
  $("sess").textContent = "";
  $("apply").disabled = true;
  $("plan").innerHTML = "";
  renderContext([]);
  render();
};

MemAuth.install({
  onSignedIn: () => {
    messages = []; reviewedOps = null; reviewedFrom = null;
  sessionId = null; sessionDate = null;
  $("sess").textContent = "";
    $("apply").disabled = true;
    $("plan").innerHTML = "";
    renderContext([]);
    render();
    toast("已登录");
  },
});

render();
</script>
</body>
</html>
