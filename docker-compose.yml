# ─── memory_backend Docker Compose ───
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f

version: "3.9"

services:
  memory-backend:
    build: .
    container_name: memory-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override storage to use the mounted volume
      - STORAGE_BACKEND=${STORAGE_BACKEND:-disk}
      - LOCAL_BUCKET_ROOT=/data/bucket
    volumes:
      - memory_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  memory_data:
    driver: local
