# Local test dependency for Memory System.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: agfs-mem-test-elasticsearch
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: "${ES_PASSWORD:-elastic}"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - elasticsearch-test-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -E 'green|yellow'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1

volumes:
  elasticsearch-test-data:
